[project]
name = "heritrace"
version = "3.0.0"
description = "An environment for semantic data curation"
authors = [{name = "Arcangelo Massari", email = "arcangelo.massari@unibo.it"}]
license = {text = "ISC"}
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "docker>=7.1.0",
    "flask>=3.1.2",
    "flask-babel>=4.0.0",
    "flask-login>=0.6.3",
    "flask-wtf>=1.1.1",
    "gunicorn>=25.1.0",
    "pyopenssl>=24.3.0",
    "pyshacl>=0.30.1",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.1",
    "rdflib-ocdm==2.0.0",
    "requests>=2.31.0",
    "requests-oauthlib>=2.0.0",
    "setuptools>=68.2.2",
    "sparqlwrapper>=2.0.0",
    "time-agnostic-library>=6.0.0",
    "validators==0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--junitxml=pytest-report.xml"

[tool.coverage.run]
source = ["heritrace"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["heritrace", "default_components"]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["user_testing"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "COM812",
    "ISC001",
    "S608",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT019", "ANN", "PLR2004", "PLR0913", "PLR0915", "PLR0912", "C901", "ARG001", "ARG002"]
"tests/conftest.py" = ["S603", "S607"]
"demo/**" = ["INP001", "T201"]
"demo/scripts/virtuoso_utils.py" = ["S105", "S603"]
"dev/**" = ["INP001", "T201"]
"dev/generate_ssl_cert.py" = ["S104"]
"default_components/**" = ["INP001"]
"heritrace/scripts/**" = ["T201"]
"heritrace/cli.py" = ["S603", "S605", "S607"]
"heritrace/extensions.py" = ["S104"]
"heritrace/apis/zenodo.py" = ["DTZ007"]
"heritrace/utils/datatypes_validation.py" = ["DTZ007"]
"config.py" = ["INP001"]
"app.py" = ["INP001", "S104"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "beautifulsoup4>=4.13.3",
    "cffconvert>=2.0.0",
    "coverage>=7.6.12",
    "genbadge[coverage]>=1.1.3",
    "pyright>=1.1.409",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "responses>=0.25.6",
    "reuse>=6.2.0",
    "ruff>=0.15.14",
]
