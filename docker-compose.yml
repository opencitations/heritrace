services:
  dataset-db:
    image: arcangelo7/heritrace-demo-dataset:1.0.0
    restart: unless-stopped
    environment:
      - DBA_PASSWORD=dba
      - DAV_PASSWORD=dba
      - CONTAINER_TYPE=dataset
    volumes:
      - ./dataset_database:/database
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8890/sparql"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - heritrace-network

  provenance-db:
    image: arcangelo7/heritrace-demo-dataset:1.0.0
    restart: unless-stopped
    environment:
      - DBA_PASSWORD=dba
      - DAV_PASSWORD=dba
      - CONTAINER_TYPE=provenance
    volumes:
      - ./prov_database:/database
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8890/sparql"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - heritrace-network

  web:
    image: arcangelo7/heritrace:3.1.2
    ports:
      - "5000:5000"
    depends_on:
      dataset-db:
        condition: service_healthy
      provenance-db:
        condition: service_healthy
    environment:
      # Application settings
      - FLASK_ENV=demo
      - APP_TITLE=HERITRACE
      - APP_SUBTITLE=An environment for semantic data curation

      # Security (REQUIRED: Change this!)
      - SECRET_KEY=your-secure-secret-key-here
      - CACHE_VALIDITY_DAYS=7

      # Database endpoints
      - DATASET_DB_URL=http://dataset-db:8890/sparql
      - PROVENANCE_DB_URL=http://provenance-db:8890/sparql
      - DATASET_DB_TRIPLESTORE=virtuoso
      - PROVENANCE_DB_TRIPLESTORE=virtuoso

      # Query Configuration
      - COUNT_LIMIT=10000

      # Database settings
      - DATASET_DB_TEXT_INDEX_ENABLED=false
      - DATASET_IS_QUADSTORE=true
      - PROVENANCE_IS_QUADSTORE=true

      # ORCID authentication (get from https://orcid.org/developer-tools)
      - ORCID_CLIENT_ID=your-client-id
      - ORCID_CLIENT_SECRET=your-client-secret
      - ORCID_SAFELIST=0000-0000-0000-0000,0000-0000-0000-0001  # Comma-separated ORCID IDs

      # Provenance settings
      - DATASET_GENERATION_TIME=2024-01-01T00:00:00+00:00
      - PRIMARY_SOURCE=https://example.org

      # Base namespace for the default IRI generator (used only when the component
      # classes below are left unset)
      - BASE_IRI=https://example.org

      # Entity handling strategies (Options: ASK, DELETE, KEEP)
      - ORPHAN_HANDLING_STRATEGY=ASK
      - PROXY_HANDLING_STRATEGY=ASK

      # Gunicorn Configuration
      - GUNICORN_WORKERS=2
      - MAX_WORKERS=8
      # - GUNICORN_TIMEOUT=120

      # Catalogue pagination settings
      - CATALOGUE_DEFAULT_PER_PAGE=50
      - CATALOGUE_ALLOWED_PER_PAGE=50,100,200,500

      # IRI minting components. Leave both unset for the built-in default: a UUID-based
      # generator (BASE_IRI/<uuid>) with provenance counters in Redis, requiring no code.
      # Set both for a custom convention; the values below are the OpenCitations Meta
      # example.
      - COUNTER_HANDLER_CLASS=default_components.meta_counter_handler.MetaCounterHandler
      - URI_GENERATOR_CLASS=default_components.meta_uri_generator.MetaURIGenerator
    volumes:
      # Expose configuration files for customization (optional)
      # - ./shacl.ttl:/app/shacl.ttl
      # - ./display_rules.yaml:/app/display_rules.yaml

      # Default components
      # - ./default_components:/app/default_components

      # Mount custom components (optional - create your own directory)
      # - ./custom_components:/app/custom_components

      # Redis data persistence
      - ./redis-data:/data
    networks:
      - heritrace-network

networks:
  heritrace-network:
    driver: bridge
