services:
  dataset-db:
    image: arcangelo7/heritrace-iswc2026-database:1.0.0
    restart: unless-stopped
    environment:
      - DBA_PASSWORD=dba
      - DAV_PASSWORD=dba
      - CONTAINER_TYPE=dataset
    volumes:
      - ./dataset_database:/database
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8890/sparql"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - heritrace-network

  provenance-db:
    image: arcangelo7/heritrace-iswc2026-database:1.0.0
    restart: unless-stopped
    environment:
      - DBA_PASSWORD=dba
      - DAV_PASSWORD=dba
      - CONTAINER_TYPE=provenance
    volumes:
      - ./prov_database:/database
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8890/sparql"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - heritrace-network

  config-seed:
    image: arcangelo7/heritrace:3.2.0
    # Copies the example configuration into ./config on the first start. Files
    # already in the folder stay as they are, so edits made in the app survive.
    entrypoint: [/app/.venv/bin/python, -m, heritrace.scripts.seed_config]
    command: [/app/config, /app/example_configurations/opencitations_meta]
    volumes:
      - ./config:/app/config

  web:
    image: arcangelo7/heritrace:3.2.0
    ports:
      - "5000:5000"
    depends_on:
      dataset-db:
        condition: service_healthy
      provenance-db:
        condition: service_healthy
      config-seed:
        condition: service_completed_successfully
    environment:
      - FLASK_ENV=demo

      # Security (REQUIRED: Change this!)
      - SECRET_KEY=your-secure-secret-key-here

      # Configuration folder, edited in the app by the administrators
      - CONFIG_DIR=/app/config
      - ADMIN_ORCIDS=http://example.org/demo/demo_user

      # Database endpoints
      - DATASET_DB_URL=http://dataset-db:8890/sparql
      - PROVENANCE_DB_URL=http://provenance-db:8890/sparql
      - DATASET_DB_TRIPLESTORE=virtuoso
      - PROVENANCE_DB_TRIPLESTORE=virtuoso

      # Database settings
      - DATASET_DB_TEXT_INDEX_ENABLED=false
      - DATASET_IS_QUADSTORE=true
      - PROVENANCE_IS_QUADSTORE=true

      # ORCID authentication (get from https://orcid.org/developer-tools)
      - ORCID_CLIENT_ID=your-client-id
      - ORCID_CLIENT_SECRET=your-client-secret

      # Base namespace for the default IRI generator (used only when the component
      # classes below are left unset)
      - BASE_IRI=https://w3id.org/oc/meta/demo

      # Gunicorn Configuration
      - GUNICORN_WORKERS=2
      # - GUNICORN_TIMEOUT=120

      # IRI minting components. Leave both unset for the built-in default: a UUID-based
      # generator (BASE_IRI/<uuid>) with provenance counters in Redis, requiring no code.
      # Set both for a custom convention; the values below are the OpenCitations Meta
      # example.
      - COUNTER_HANDLER_CLASS=default_components.meta_counter_handler.MetaCounterHandler
      - URI_GENERATOR_CLASS=default_components.meta_uri_generator.MetaURIGenerator
    volumes:
      - ./config:/app/config

      # Default components
      # - ./default_components:/app/default_components

      # Mount custom components (optional - create your own directory)
      # - ./custom_components:/app/custom_components

      # Redis data persistence
      - ./redis-data:/data
    networks:
      - heritrace-network

networks:
  heritrace-network:
    driver: bridge
